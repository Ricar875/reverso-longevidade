<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REVERSO - Longevidade com Ciência</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- NAVEGAÇÃO PRINCIPAL -->
    <nav class="nav-demo">
        <button class="active" data-page="home">🏠 Início</button>
        <button data-page="habitos">📋 Hábitos</button>
        <button data-page="calculadora">🧮 Calculadora</button>
        <button data-page="dashboard">📊 Dashboard</button>
        <button data-page="membros">🔐 Membros</button>
        <button data-page="admin">⚙️ Admin</button>
    </nav>

    <!-- CONTEÚDO DAS PÁGINAS -->
    <div class="page-container">
        
        <!-- PÁGINA INICIAL -->
        <div class="page-content active" id="page-home">
            <h1>Pare de envelhecer.<br><span style="color:#6ee7b7;">Comece a viver.</span></h1>
            <p>Os 18 hábitos que estão encurtando sua vida — e o plano científico para reverter cada um deles.</p>
            <button class="btn-primary">COMEÇAR AGORA →</button>
        </div>

        <!-- PÁGINA HÁBITOS -->
        <div class="page-content" id="page-habitos">
            <h2>Os <span style="color:#6ee7b7;">18 Hábitos</span></h2>
            <div id="listaHabitos"></div>
        </div>

        <!-- PÁGINA CALCULADORA -->
        <div class="page-content" id="page-calculadora">
            <h2>Sua <span style="color:#6ee7b7;">Idade Biológica</span></h2>
            <div id="calculadoraForm"></div>
        </div>

        <!-- PÁGINA DASHBOARD -->
        <div class="page-content" id="page-dashboard">
            <h2>Olá, <span style="color:#6ee7b7;">Maria</span> 👋</h2>
            <div id="dashboardContent"></div>
        </div>

        <!-- PÁGINA MEMBROS -->
        <div class="page-content" id="page-membros">
            <h2>Área de <span style="color:#6ee7b7;">Membros</span></h2>
            <div id="membrosForm"></div>
        </div>

        <!-- PÁGINA ADMIN -->
        <div class="page-content" id="page-admin">
            <h2>Painel <span style="color:#6ee7b7;">Administrativo</span></h2>
            <div id="adminContent"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
